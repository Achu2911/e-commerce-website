services:
  - type: web
    name: shopkart
    env: python

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn saros_project.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120

    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: shopkart.onrender.com

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false


