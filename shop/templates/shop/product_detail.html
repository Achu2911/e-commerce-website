{% extends "shop/base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid">
        {% endif %}
    </div>

    <div class="col-md-6">
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <h4>₹{{ product.price }}</h4>

        <a href="{% url 'shop:add_to_cart' product.id %}"
           class="btn btn-success">
            Add to Cart
        </a>
    </div>
</div>
{% endblock %}
